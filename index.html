<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090713"><title>LIAR ROYALE · 라이어 로얄</title><style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap');
:root{font-family:Outfit,'Noto Sans KR',sans-serif;color:#f9f2ff;background:#090713;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 12% 6%,#3c195a88,transparent 40%),radial-gradient(ellipse at 95% 62%,#132e6480,transparent 43%),#090713}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.shell{max-width:480px;min-height:100dvh;margin:auto;position:relative;overflow:hidden;padding:25px 22px max(26px,env(safe-area-inset-bottom))}.shell:before{content:'';position:absolute;width:230px;height:230px;border:1px solid #b597ff18;border-radius:50%;top:10%;left:-140px;pointer-events:none}.brand{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}.logo{font-size:13px;font-weight:900;letter-spacing:4px;background:linear-gradient(100deg,#fff0b1,#dbaaff);-webkit-background-clip:text;background-clip:text;color:transparent}.sub{font-size:10px;color:#a59ab7;letter-spacing:2px}.iconbtn{background:#ffffff10;border:1px solid #ffffff20;color:white;border-radius:12px;padding:10px}.hero{text-align:center;padding:32px 0 17px}.halo{width:188px;height:188px;margin:0 auto 16px;display:grid;place-items:center;position:relative;filter:drop-shadow(0 0 35px #a442bb50)}.halo:before,.halo:after{content:'';position:absolute;border-radius:50%;border:1px solid #e4b9ff50;inset:5px;transform:rotate(-20deg);box-shadow:inset 0 0 30px #ae58f022}.halo:after{inset:23px;border:1px dashed #e3a6ff80;animation:spin 25s linear infinite}.mask{font-size:91px;z-index:1;filter:drop-shadow(0 7px 9px #0009)}@keyframes spin{to{transform:rotate(360deg)}}h1{font-size:45px;line-height:1.1;letter-spacing:-2px;margin:0;font-weight:900}h1 span,.shine{background:linear-gradient(100deg,#d6a8ff,#ffe6a8,#bf9dff);color:transparent;background-clip:text;-webkit-background-clip:text}.lead{font-size:13px;color:#aaa0b8;line-height:1.9;margin:17px 0 20px}.panel{background:linear-gradient(145deg,#251a3dbd,#121224df);border:1px solid #9575ba55;border-radius:25px;padding:23px;box-shadow:0 20px 65px #02010d70,inset 0 1px #ffffff20;position:relative}.panel h2{margin:0 0 20px;font-size:19px}.field{margin:15px 0}.field label{display:block;font-size:11px;font-weight:700;letter-spacing:1px;color:#baa8d2;margin-bottom:9px}input{background:#100f22;color:#fff;border:1px solid #72608780;border-radius:14px;padding:15px 16px;width:100%;outline:none}input:focus{border-color:#d7a9ff;box-shadow:0 0 0 3px #9f64ea20}input::placeholder{color:#645e76}.primary,.secondary,.ghost{width:100%;border-radius:15px;padding:16px;font-size:15px;font-weight:900;border:0;transition:transform .14s}.primary:active,.secondary:active{transform:scale(.98)}.primary{background:linear-gradient(105deg,#d4a3ff,#a46bfa 50%,#f2c58d);color:#23102d;box-shadow:0 8px 29px #af68df38}.secondary{background:#ffffff11;border:1px solid #ffffff2c;color:#fff}.ghost{background:none;color:#c2a9e5;border:1px solid #ffffff25}.dividerText{display:flex;gap:12px;align-items:center;color:#6d6480;font-size:11px;margin:16px 0}.dividerText:before,.dividerText:after{content:'';height:1px;flex:1;background:#ffffff19}.mini{display:flex;justify-content:center;gap:19px;color:#9990ab;font-size:11px;margin-top:25px}.mini b{color:#ebcafa}.pill{border:1px solid #eccd9760;background:#ffd88b10;color:#ffdda1;padding:7px 12px;border-radius:50px;font-size:11px;font-weight:800;letter-spacing:1px}.topline{display:flex;justify-content:space-between;align-items:center;margin-top:32px}.kicker{font-size:10px;color:#c5a1f4;letter-spacing:2.6px;font-weight:800;margin-bottom:8px}.title{font-size:29px;letter-spacing:-1px;margin:0 0 10px}.muted{color:#aaa0bc;font-size:12px;line-height:1.9}.roomcode{font-size:58px;line-height:1.2;letter-spacing:10px;font-weight:900;color:#ffe3ac;text-shadow:0 0 27px #d9987255;text-align:center;margin:12px 0}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.stat{border:1px solid #ffffff19;border-radius:15px;padding:15px;background:#ffffff08;text-align:center}.stat strong{font-size:25px;display:block}.stat span{font-size:10px;color:#aaa0bc}.players{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 21px}.player{min-width:0;background:#ffffff09;border:1px solid #ffffff20;border-radius:17px;padding:14px 4px;text-align:center;position:relative}.player.me{border-color:#d1a3ff99;background:#a977ee14}.avatar{width:43px;height:43px;border-radius:50%;display:grid;place-items:center;margin:0 auto 7px;font-size:19px;background:linear-gradient(145deg,#6738a0,#261b4b);border:1px solid #b98bff4f}.playername{font-size:11px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:100%;padding:0 4px}.tag{font-size:9px;color:#ffdf9d;margin-top:4px}.progress{height:7px;border-radius:8px;background:#ffffff18;overflow:hidden;margin:15px 0}.progress div{height:100%;background:linear-gradient(90deg,#9b6dff,#e9b7ff);border-radius:8px}.bigcard{width:100%;aspect-ratio:1/.98;border-radius:24px;border:1px solid #d9afff79;background:radial-gradient(circle at 50% 10%,#7047a1,#1e1734 70%);box-shadow:0 17px 65px #6e34a73b,inset 0 0 55px #6e56a62e;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;animation:appear .45s ease}.bigcard .symbol{font-size:68px}.bigcard .word{font-size:40px;font-weight:900;letter-spacing:-1px;text-align:center;word-break:keep-all}.bigcard .cat{font-size:12px;color:#e7caa6;letter-spacing:2px}.bigcard.liar{background:radial-gradient(circle at 50% 10%,#aa3167,#241129 75%);border-color:#ff839d}.bigcard.liar .word{color:#ff94ac}@keyframes appear{from{opacity:0;transform:translateY(15px) scale(.95)}to{opacity:1;transform:none}}.cardback{background:repeating-linear-gradient(45deg,#2a1d48,#2a1d48 12px,#342354 12px,#342354 24px);border:2px solid #a582d8;cursor:pointer}.cardback .symbol{font-size:92px}.timer{font-size:77px;font-weight:900;line-height:1.15;margin:12px 0 0;text-align:center;font-variant-numeric:tabular-nums;background:linear-gradient(#ffe7b7,#d8a3ff);color:transparent;-webkit-background-clip:text;background-clip:text}.option{border:1px solid #ffffff25;border-radius:15px;padding:13px 14px;background:#ffffff0b;color:white;display:flex;gap:10px;align-items:center;width:100%;text-align:left;margin:8px 0}.option.selected{border-color:#e4b6ff;background:#b17ffb2d}.option .avatar{width:33px;height:33px;margin:0;font-size:15px}.option .right{margin-left:auto;color:#d6b8f5;font-size:12px}.notice{border:1px solid #ffe0a239;background:#ffca7020;color:#f6d5a0;border-radius:15px;padding:13px;font-size:12px;line-height:1.8;margin:15px 0}.trophy{font-size:82px;text-align:center;padding:23px 0}.scoreline{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid #ffffff14}.scoreline strong{color:#f6d79d}.caption{text-align:center;font-size:10px;color:#7e738f;padding:22px 0 6px}.actiongroup{display:grid;gap:10px;margin-top:15px}.row{display:flex;align-items:center;justify-content:space-between;gap:9px}.smallbtn{width:auto;padding:9px 13px;font-size:12px}.select{border-radius:10px;background:#1b1830;color:#f5e9ff;border:1px solid #6e5b8d;padding:10px}.toast{position:fixed;z-index:50;bottom:35px;left:50%;transform:translateX(-50%);background:#f4deff;color:#2c1942;padding:12px 18px;border-radius:12px;max-width:90vw;text-align:center;font-size:12px;font-weight:800;box-shadow:0 10px 28px #0008}

/* Edge-to-edge responsive layout: usable across mobile viewport sizes. */
html{width:100%;min-height:100%;background:#090713;overflow-x:hidden}
body{width:100%;min-height:100vh;min-height:100dvh;overflow-x:hidden;overscroll-behavior-y:contain}
.shell{width:100%;max-width:none;min-height:100vh;min-height:100dvh;margin:0;padding:calc(12px + env(safe-area-inset-top,0px)) max(15px,env(safe-area-inset-right,0px)) calc(15px + env(safe-area-inset-bottom,0px)) max(15px,env(safe-area-inset-left,0px));overflow-x:clip;display:flex;flex-direction:column}
.shell>.caption{margin-top:auto}
.panel,.bigcard,.option,.stats,.players{max-width:100%;min-width:0}
.roomcode{overflow-wrap:anywhere;font-size:clamp(36px,13vw,64px);letter-spacing:clamp(3px,2vw,10px)}

.bigcard{min-height:210px;max-height:min(53dvh,460px)}

@media (max-width:380px){.panel{padding:17px;border-radius:20px}.hero{padding:15px 0 10px}.halo{width:clamp(105px,34vw,150px);height:clamp(105px,34vw,150px);margin-bottom:6px}.mask{font-size:65px}.mini{gap:9px}.players{gap:6px}.player{padding:10px 2px}.logo{letter-spacing:2px}.sub{letter-spacing:1px}.bigcard .word{font-size:clamp(23px,8vw,36px)}}
@media (max-height:740px){.hero{padding:12px 0 9px}.halo{width:124px;height:124px;margin-bottom:6px}.halo:after{inset:14px}.mask{font-size:64px}.lead{margin:9px 0 12px}.topline{margin-top:16px}.trophy{padding:12px 0}.caption{padding:10px 0 3px}.bigcard{max-height:47dvh}}
@media (max-height:600px){.hero{padding:8px 0}.halo{width:88px;height:88px}.mask{font-size:48px}.shell{padding-top:calc(7px + env(safe-area-inset-top,0px))}.lead{line-height:1.45}.topline{margin-top:10px}.panel{padding:14px}.bigcard{min-height:170px}.timer{font-size:55px}}
@media (min-width:700px){.shell{padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}.hero{padding-top:24px}.panel{max-width:900px;margin-left:auto;margin-right:auto}.players{grid-template-columns:repeat(5,minmax(0,1fr))}.bigcard{max-width:660px;margin-left:auto;margin-right:auto}.actiongroup{max-width:900px;margin-left:auto;margin-right:auto}}

</style></head><body><main class="shell" id="app"></main><script>
const app=document.getElementById('app');let session=JSON.parse(sessionStorage.getItem('liar-session')||'null'),state=null,es=null,flipped=false,selected=null,now=Date.now(),toastTimer;
const $=s=>document.querySelector(s),escapeHTML=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const icons=['🦊','🐱','🦁','🐼','🐸','🐯','🐰','🐻','🐨','🐵','🦄','🐧','🐺','🦋','🐙'];
function message(t){document.querySelector('.toast')?.remove();let a=document.createElement('div');a.className='toast';a.textContent=t;document.body.appendChild(a);clearTimeout(toastTimer);toastTimer=setTimeout(()=>a.remove(),2700)}
async function api(action,extra={}){try{const r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...session,...extra})}),d=await r.json();if(!r.ok)throw Error(d.error||'요청 실패');if(d.token){session={token:d.token,code:d.code};sessionStorage.setItem('liar-session',JSON.stringify(session));subscribe()}if(d.state){const old=state?.phase;state=d.state;if(old!==state.phase){flipped=false;selected=null}render()}if(action==='leave'){session=null;state=null;sessionStorage.removeItem('liar-session');es?.close();render()}return d}catch(e){message(e.message);return null}}
function subscribe(){es?.close();if(!session)return;es=new EventSource('/events?code='+encodeURIComponent(session.code)+'&token='+encodeURIComponent(session.token));es.onmessage=e=>{const d=JSON.parse(e.data),old=state?.phase;if(old!==d.phase){flipped=false;selected=null}state=d;render()};es.onerror=()=>{} }
const header=()=>`<div class="brand"><div><div class="logo">♛ LIAR ROYALE</div><div class="sub">THE ULTIMATE PARTY GAME</div></div><div style="display:flex;gap:7px;align-items:center"><button class="iconbtn" onclick="toggleFullscreen()" aria-label="전체화면" title="전체화면">⛶</button><button class="iconbtn" onclick="sound()" aria-label="효과음">${localStorage.getItem('liar-mute')==='1'?'🔇':'🔊'}</button></div></div>`;
let ctx;function play(){if(localStorage.getItem('liar-mute')==='1')return;try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(480,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(800,ctx.currentTime+.15);g.gain.setValueAtTime(.05,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.19);o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+.2)}catch{}}function sound(){localStorage.setItem('liar-mute',localStorage.getItem('liar-mute')==='1'?'0':'1');play();render()}
function home(){return `<section class="hero"><div class="halo"><div class="mask">🎭</div></div><div class="kicker">TRUST NO ONE</div><h1>LIAR <span>ROYALE</span></h1><p class="lead">단 하나의 거짓말, 모두를 속여라.<br>최대 15인이 즐기는 프리미엄 라이어 게임.</p></section><div class="panel"><h2>✨ 파티에 입장하세요</h2><div class="field"><label>YOUR NICKNAME</label><input id="name" maxlength="12" placeholder="닉네임을 입력하세요" autocomplete="nickname" value="${escapeHTML(localStorage.getItem('liar-name')||'')}"></div><button class="primary" onclick="makeRoom()">✦ 새로운 방 만들기</button><div class="dividerText">또는 친구 방 입장</div><div class="field"><label>4-DIGIT ROOM CODE</label><input id="room" inputmode="numeric" maxlength="4" pattern="[0-9]*" placeholder="0000" style="font-size:25px;text-align:center;letter-spacing:9px"></div><button class="secondary" onclick="joinRoom()">→ 방 코드로 입장</button></div><div class="mini"><span>👥 <b>3–15명</b></span><span>🔒 <b>비밀 제시어</b></span><span>⚡ <b>실시간 투표</b></span></div>`}
async function makeRoom(){let name=$('#name').value.trim();if(!name)return message('닉네임을 입력하세요.');localStorage.setItem('liar-name',name);await api('create',{name})}async function joinRoom(){let name=$('#name').value.trim(),code=$('#room').value.trim();if(!name)return message('닉네임을 입력하세요.');if(!/^\d{4}$/.test(code))return message('4자리 숫자 코드를 입력해 주세요.');localStorage.setItem('liar-name',name);await api('join',{name,code})}
function common(t,sub){return `<div class="topline"><span class="pill">✦ ROUND ${state.round||'READY'}</span><button class="iconbtn" onclick="leaveRoom()" style="font-size:11px">나가기</button></div><div style="padding-top:24px"><div class="kicker">${t}</div><h2 class="title">${sub}</h2></div>`}function persons(showVote=false){return `<div class="players">${state.players.map((p,i)=>`<div class="player ${p.id===state.me?'me':''}"><div class="avatar">${icons[i%icons.length]}</div><div class="playername">${escapeHTML(p.name)}</div><div class="tag">${p.id===state.host?'♛ HOST':p.id===state.me?'YOU':showVote&&p.voted?'✓ 투표완료':p.ready?'✓ 확인':'◇ PLAYER'}</div></div>`).join('')}</div>`}
function lobby(){return common('PRIVATE PARTY ROOM','친구들을 초대하세요')+`<div class="panel"><div class="muted" style="text-align:center">입장 코드 · 눌러서 복사</div><div class="roomcode" onclick="copyCode()">${state.code}</div><button class="secondary" onclick="copyInvite()">🔗 초대 링크 복사</button><div class="stats"><div class="stat"><strong>${state.players.length}<span style="display:inline;color:#88769d;font-size:16px"> / 15</span></strong><span>참가 인원</span></div><div class="stat"><strong>${state.durationSeconds||state.discussionSeconds}<span style="display:inline;color:#88769d;font-size:16px">초</span></strong><span>토론 시간</span></div></div><div class="row"><b style="font-size:12px">참가자</b>${state.me===state.host?`<select class="select" onchange="api('duration',{seconds:Number(this.value)})">${[60,120,180,300].map(n=>`<option value="${n}" ${n===state.discussionSeconds?'selected':''}>토론 ${n/60}분</option>`).join('')}</select>`:''}</div>${persons()}${state.me===state.host?`<button class="primary" ${state.players.length<3?'disabled':''} onclick="api('start')">✦ 게임 시작하기</button>`:`<div class="notice">👑 방장이 게임을 시작하면 자동으로 카드가 배정돼요.</div>`}</div>`}
function reveal(){let ready=state.players.filter(p=>p.ready).length,me=state.players.find(p=>p.id===state.me);return common('SECRET IDENTITY','당신의 정체를 확인하세요')+`<p class="muted">카드를 눌러 뒤집고 제시어를 확인하세요. 다른 사람에게 화면을 보여주지 마세요.</p>${!flipped?`<div class="bigcard cardback" onclick="flip()"><div class="symbol">✦</div><div class="cat">TAP TO REVEAL</div><div style="font-size:13px">카드를 터치하세요</div></div>`:`<div class="bigcard ${state.isLiar?'liar':''}"><div class="symbol">${state.isLiar?'🎭':'👑'}</div><div class="cat">${state.isLiar?'YOU ARE THE LIAR':escapeHTML(state.category)+' · SECRET WORD'}</div><div class="word">${escapeHTML(state.word)}</div><div class="muted" style="text-align:center">${state.isLiar?'제시어를 모릅니다. 대화로 추리하세요!':'제시어를 직접 말하지 말고 힌트를 주세요!'}</div></div>`}<div class="actiongroup">${flipped?`<button class="primary" ${me.ready?'disabled':''} onclick="api('ready')">${me.ready?'✓ 확인 완료':'✓ 카드 확인 완료'}</button>`:''}<div class="muted" style="text-align:center">확인 완료 ${ready} / ${state.players.length}</div><div class="progress"><div style="width:${ready/state.players.length*100}%"></div></div></div>`}
function discussion(){return common('DISCUSSION TIME','누가 라이어일까요?')+`<div class="panel" style="text-align:center"><span class="pill">💬 토론 진행 중</span><div class="timer" id="timer">${timeLeft()}</div><div class="muted">차례대로 제시어에 대한 힌트를 말하세요.<br>라이어는 정체를 들키지 않아야 해요!</div><div class="progress"><div id="timerbar" style="width:${Math.max(0,(state.endsAt-Date.now())/(state.discussionSeconds*1000)*100)}%"></div></div></div><h3 style="margin-top:26px;font-size:14px">참가자 <span style="color:#ae91d1">${state.players.length}명</span></h3>${persons()}${state.me===state.host?`<button class="primary" onclick="api('voteStart')">⚡ 지금 투표 시작</button>`:`<div class="notice">토론 종료 시 자동으로 투표가 시작됩니다.</div>`}`}
function timeLeft(){const t=Math.max(0,Math.ceil((state.endsAt-Date.now())/1000));return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}
function vote(){let me=state.players.find(p=>p.id===state.me);return common('THE FINAL VOTE','라이어를 지목하세요')+`<p class="muted">가장 의심스러운 한 명을 선택하세요. 모든 플레이어가 투표하면 결과가 공개됩니다.</p><div class="panel"><div class="row"><span class="pill">🗳 투표 진행</span><span class="muted">${state.votesCount} / ${state.players.length} 완료</span></div><div class="progress"><div style="width:${100*state.votesCount/state.players.length}%"></div></div>${state.players.filter(p=>p.id!==state.me).map((p,i)=>`<button class="option ${selected===p.id?'selected':''}" ${me.voted?'disabled':''} onclick="selectVote('${p.id}')"><div class="avatar">${icons[state.players.indexOf(p)%icons.length]}</div><strong>${escapeHTML(p.name)}</strong><span class="right">${selected===p.id?'✓ 선택됨':'○'}</span></button>`).join('')}${me.voted?`<div class="notice">✓ 투표를 완료했어요. 모두가 투표할 때까지 기다려 주세요.</div>`:`<button class="primary" style="margin-top:16px" ${!selected?'disabled':''} onclick="api('vote',{target:selected})">투표 확정하기 →</button>`}</div>`}
function guess(){return common('LAST CHANCE','라이어의 마지막 기회')+`<div class="panel" style="text-align:center"><div class="trophy">🎭</div><h2>투표 결과 공개!</h2><div class="notice" style="font-size:15px;font-weight:900;color:#ffe1ad">라이어는 마지막 기회, 제시어를 맞혀 보세요!</div><h2>라이어가 발각되었습니다!</h2><p class="muted">${escapeHTML(state.guess.liarName)} 님이 제시어를 맞히면<br><b style="color:#f7dc9f">라이어만 +2점 · 다른 사람은 0점!</b></p>${state.isLiar?`<div class="field"><label>SECRET WORD GUESS</label><input id="answer" placeholder="제시어를 입력하세요"></div><button class="primary" onclick="api('guess',{answer:$('#answer').value.trim()})">✦ 최종 정답 제출</button>`:`<div class="notice">라이어가 정답을 추리하고 있어요…</div>`}</div>`}
function result(){const r=state.result,rank=[...state.players].sort((a,b)=>b.score-a.score);return common('ROUND COMPLETE','진실이 밝혀졌습니다')+`<div class="panel" style="text-align:center"><div class="trophy">${r.caught?'🎭':'👑'}</div><div class="kicker">${r.caught?'LIAR FOUND':'LIAR SURVIVED'}</div><h2 style="font-size:25px">${r.caught?'라이어를 찾아냈어요!':'라이어의 완벽한 승리!'}</h2><div class="muted">라이어 <b style="color:#ffcc99">${escapeHTML(r.liarName)}</b></div><div class="roomcode" style="font-size:32px;letter-spacing:0">${escapeHTML(r.word)}</div><div class="muted">정답 제시어</div>${r.caught?`<div class="notice">${r.guessCorrect?'라이어가 정답을 맞혔습니다! 라이어만 +2점 · 나머지 전원 0점':'시민 전원에게 +1점!'}</div>`:`<div class="notice">라이어에게 +3점!</div>`}</div><h3 style="font-size:15px;margin-top:27px">🏆 누적 랭킹</h3><div class="panel">${rank.map((p,i)=>`<div class="scoreline"><span>${['🥇','🥈','🥉'][i]||'✦'} ${escapeHTML(p.name)}</span><strong>${p.score} P</strong></div>`).join('')}</div><div class="actiongroup">${state.me===state.host?`<button class="primary" onclick="api('next')">✦ 다음 라운드</button><button class="ghost" onclick="api('lobby')">대기실로 돌아가기</button>`:`<div class="notice">방장이 다음 라운드를 시작할 때까지 기다려 주세요.</div>`}</div>`}
function render(){let body=!session||!state?home():state.phase==='lobby'?lobby():state.phase==='reveal'?reveal():state.phase==='discuss'?discussion():state.phase==='vote'?vote():state.phase==='guess'?guess():result();app.innerHTML=header()+body+`<div class="caption">LIAR ROYALE · PLAY TOGETHER · 2026</div>`}
function flip(){flipped=true;play();render()}function selectVote(p){selected=p;play();render()}function copyCode(){navigator.clipboard?.writeText(state.code).then(()=>message('방 코드가 복사됐어요!')).catch(()=>message(state.code))}function copyInvite(){let url=location.origin+'/?room='+state.code;navigator.clipboard?.writeText(url).then(()=>message('초대 링크가 복사됐어요!')).catch(()=>message(url))}
function toggleFullscreen(){try{if(document.fullscreenElement){document.exitFullscreen?.();return;}const el=document.documentElement;const p=el.requestFullscreen?.();if(p?.catch)p.catch(()=>message('이 브라우저에서는 전체화면 전환을 지원하지 않습니다. 홈 화면에 추가해 실행해 보세요.'));else if(!el.requestFullscreen)message('이 브라우저에서는 전체화면 전환을 지원하지 않습니다.');}catch(e){message('전체화면 전환이 지원되지 않습니다.')}}
function leaveRoom(){
 if(document.getElementById('leave-confirm'))return;
 const cover=document.createElement('div');
 cover.id='leave-confirm';
 cover.setAttribute('role','dialog');cover.setAttribute('aria-modal','true');cover.setAttribute('aria-label','방 나가기 확인');
 cover.style.cssText='position:fixed;inset:0;z-index:99999;background:rgba(5,3,15,.84);display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(10px)';
 cover.innerHTML='<div style="width:min(100%,380px);background:linear-gradient(145deg,#281638,#120d22);border:1px solid #a87dcc;border-radius:22px;padding:27px 22px;box-shadow:0 15px 70px #000b;text-align:center;color:#fff"><div style="font-size:35px;margin-bottom:12px">🚪</div><h2 style="font-size:23px;margin:0 0 12px">방에서 나갈까요?</h2><p style="color:#c7b8d6;font-size:14px;line-height:1.6;margin:0 0 24px">현재 게임 화면에서 나와 처음 화면으로 돌아갑니다.</p><button id="leave-yes" type="button" style="width:100%;padding:16px;border:0;border-radius:13px;background:linear-gradient(110deg,#f7c77e,#d895ff);color:#1a0c24;font-size:16px;font-weight:900;margin-bottom:10px;cursor:pointer">나가기</button><button id="leave-no" type="button" style="width:100%;padding:15px;border:1px solid #6a507b;border-radius:13px;background:#20162d;color:#fff;font-size:15px;font-weight:700;cursor:pointer">계속 플레이</button></div>';
 document.body.appendChild(cover);
 document.getElementById('leave-no').onclick=()=>cover.remove();
 document.getElementById('leave-yes').onclick=async()=>{
  const btn=document.getElementById('leave-yes');btn.disabled=true;btn.textContent='나가는 중…';
  try{await api('leave');}finally{cover.remove();}
 };
}
setInterval(()=>{if(state?.phase==='discuss'){const t=$('#timer'),p=$('#timerbar');if(t)t.textContent=timeLeft();if(p)p.style.width=Math.max(0,(state.endsAt-Date.now())/(state.discussionSeconds*1000)*100)+'%'}},300);
if(session){subscribe();api('state').then(d=>{if(!d){session=null;sessionStorage.removeItem('liar-session');render()}})}render();const roomParam=new URLSearchParams(location.search).get('room');if(roomParam&&/^\d{4}$/.test(roomParam)&&!session){$('#room').value=roomParam;message('초대받은 방 코드가 입력됐어요!')}
</script></body></html>
